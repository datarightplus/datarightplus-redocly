description: >-
  An [RFC4122](https://tools.ietf.org/html/rfc4122) UUID used as
  a correlation id. If provided, the data holder must play back
  this value in the _x-fapi-interaction-id_ response header. If not
  provided a [RFC4122](https://tools.ietf.org/html/rfc4122) UUID
  value is required to be provided in the response header to track
  the interaction. This header MUST be responded for success and
  error responses for authenticated APIs.
explode: false
schema:
  type: string
  format: uuid
  example: "6ba7b814-9dad-11d1-80b4-00c04fd430c8"
style: simple
