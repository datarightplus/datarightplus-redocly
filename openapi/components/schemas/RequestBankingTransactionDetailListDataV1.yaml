type: object
properties:
  accountIds:
    description: Array of specific account IDs to obtain data for. If absent all accounts within an agreement are included.
    items:
      type: string
      x-cds-type: ASCIIString
    type: array
    example:
      - 7b2604da-0810-4ad4-8c74-7ce0487ed26e
      - 67d542f5-e0ec-4df5-821e-4dbf02c4403f
  oldestTime:
    description: >-
      Constrain the transaction history request to transactions with effective time
      at or after this date/time. Format is aligned to DateTimeString common type.
    type: string
    format: date-time
    x-cds-type: DateTimeString
  newestTime:
    description: >-
      Constrain the transaction history request to transactions with effective time
      at or before this date/time. Format is aligned to DateTimeString common type
    type: string
    format: date-time
    x-cds-type: DateTimeString
  minAmount:
    description: >-
      Filter transactions to only transactions with amounts higher or equal to than
      this amount
    type: string
    x-cds-type: AmountString
    example: "1.00"
  maxAmount:
    description: >-
      Filter transactions to only transactions with amounts less than or equal to
      than this amount
    type: string
    x-cds-type: AmountString
    example: "120.00"
required:
  - oldestDate
  - newestDate
