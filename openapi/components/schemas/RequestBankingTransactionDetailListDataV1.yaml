type: object
properties:
  accountIds:
    description: Array of specific account IDs to obtain data for
    items:
      type: string
      x-cds-type: ASCIIString
    type: array
  oldestDate:
    description: >-
      Constrain the request to records with effective date at or after this date.
      Format is aligned to DateString common type
    type: string
    format: date
    x-cds-type: DateString
    example: "2023-07-01"
  newestDate:
      description: >-
        Constrain the request to records with effective date at or before this date.
        Format is aligned to DateString common type
      type: string
      format: date
      x-cds-type: DateString
      example: "2024-06-30"
  minAmount:
    description: >-
      Filter transactions to only transactions with amounts higher or equal to than
      this amount
    type: string
    x-cds-type: AmountString
  maxAmount:
    description: >-
      Filter transactions to only transactions with amounts less than or equal to
      than this amount
    type: string
    x-cds-type: AmountString
required:
  - accountId
  - oldestDate
  - newestDate
