type: object
properties:
  accountIds:
    description: Array of specific account IDs to obtain data for. If absent all accounts within an agreement are included.
    items:
      type: string
      x-cds-type: ASCIIString
    type: array
    example:
      - 7b2604da-0810-4ad4-8c74-7ce0487ed26e
      - 67d542f5-e0ec-4df5-821e-4dbf02c4403f
  oldestDate:
    description: >-
      Constrain the request to records with effective date at or after this date.
      Format is aligned to DateString common type
    type: string
    format: date
    x-cds-type: DateString
    example: "2023-07-01"
  newestDate:
      description: >-
        Constrain the request to records with effective date at or before this date.
        Format is aligned to DateString common type
      type: string
      format: date
      x-cds-type: DateString
      example: "2024-06-30"
  minAmount:
    description: >-
      Filter transactions to only transactions with amounts higher or equal to than
      this amount
    type: string
    x-cds-type: AmountString
  maxAmount:
    description: >-
      Filter transactions to only transactions with amounts less than or equal to
      than this amount
    type: string
    x-cds-type: AmountString
required:
  - oldestDate
  - newestDate
