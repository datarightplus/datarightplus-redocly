properties:
  switchId:
    description: >-
      Switch Identifier following submission.
    type: string
    format: uuid
    example: e1529071-601f-46ff-a097-97cdaba84065
  msatsChangeRequest:
    $ref: ./EnergyMSATSChangeRequestV1.yaml
  creationDateTime:
    description: Creation Date/Time
    type: string
    format: date-time
    x-cds-type: DateTimeString
    example: 2024-02-31T08:14:25Z
  lastUpdated:
    description: Last Status Update time
    type: string
    format: date-time
    x-cds-type: DateTimeString
    example: 2024-08-31T08:14:25Z
required:
  - switchId
  - msatsChangeRequest
  - creationDateTime
  - lastUpdated
type: object
